<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Smaily Chickles | Perfil</title>
  
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Electrolize&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    :root {
      --primary: #2563eb;
    }
    body {
      margin: 0;
      font-family: 'Electrolize', system-ui, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .profile-header {
      background: white;
      border-radius:;
      overflow: hidden;
      box-shadow:;
    }
    .cover {
    	position: relative;
    	width: 100%;
      height: 240px;
      background: url('https://i.postimg.cc/5tjZDbFG/8d7265278f12c0dac6bdacbc0ab2ea19.webp') center/cover;
    }
    .profile-info {
      display:;
      align-content: center;
      justify-content: center;
      align-items: center;
      padding:0;
      margin-top: 20px;
      text-align: center;
    }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 6px solid white;
      object-fit: cover;
    }
    .name {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0;
    }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 30px 15px;
      border-top: 1px solid #e2e8f0;
    }
    .tab {
      padding: 16px 20px;
      border: none;
      background: none;
      font-weight: 700;
      cursor: pointer;
      color: #64748b;
    }
    .tab.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .composer {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    textarea {
      width: 100%;
      min-height: 100px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      font-size: 1rem;
      resize: vertical;
    }
    .btn {
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
    }
    .post, .story {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .post-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .gallery-item {
      aspect-ratio: 1/1;
      border-radius: 16px;
      overflow: hidden;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .story-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 10px;
    }
    .story-item {
      width: 120px;
      height: 200px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .story-item img, .story-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .story-author {
      position: absolute;
      bottom: 8px;
      left: 8px;
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
    <!-- Header -->
    <div class="profile-header text-center">
      <div class="cover"></div>
      
      <div class="profile-info">
     <!--   <img class="avatar" src="https://images.unsplash.com/photo-1548550023-2bdb3c5beed7" alt="Perfil">-->
        
        <div style="bg-white">
          <h1 class="name">Don Smaily Chickles</h1>
          <p style="margin:4px 0 0; color:#64748b;">Creador de momentos</p>
        </div></div><br>
        
        <div>
          <button class="btn btn-primary" onclick="showProfileSwitcher()">👤 Cambiar Perfil</button>
        </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="posts">Publicaciones</button>
        <button class="tab" data-tab="stories">Stories</button>
        <button class="tab" data-tab="photos">Fotos</button>
        <button class="tab" data-tab="about">Información</button>
      </div>
    </div>

    <!-- Contenido -->
    <div style="margin-top: 25px;">
      
      <!-- Publicaciones -->
      <div id="postsPanel" class="panel active">
        <div class="composer">
          <textarea id="postContent" placeholder="¿Qué quieres publicar?"></textarea>
          <div style="margin-top:12px; display:flex; gap:12px; align-items:center;">
            <input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none">
            <button class="btn" onclick="document.getElementById('mediaInput').click()">📷 Foto/Video</button>
            <button class="btn btn-primary" onclick="createPost()">Publicar</button>
          </div>
        </div>
        <div id="postsList"></div>
      </div>

      <!-- Stories -->
      <div id="storiesPanel" class="panel">
        <div class="composer">
          <h3 style="margin:0 0 12px;">Crear Story (desaparece en 24h)</h3>
          <input type="file" id="storyInput" accept="image/*,video/*">
          <button class="btn btn-primary" style="margin-top:12px;" onclick="createStory()">Publicar Story</button>
        </div>
        <div id="storiesList" class="story-container"></div>
      </div>

      <!-- Fotos -->
      <div id="photosPanel" class="panel">
        <div class="gallery" id="gallery"></div>
      </div>

      <!-- Información -->
      <div id="aboutPanel" class="panel">
        <div style="background:white; padding:30px; border-radius:20px;">
          <h2>Información de Don Smaily Chickles</h2>
          <p>Esta es una página de perfil personal con sistema de perfiles múltiples.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de selección de perfil -->
  <div id="profileModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:999;">
    <div style="background:white; padding:30px; border-radius:20px; width:90%; max-width:380px;">
      <h3 style="margin-top:0;">¿Cómo quieres publicar?</h3>
      
      <div onclick="selectProfile('owner')" style="padding:16px; border:1px solid #ddd; border-radius:12px; margin:8px 0; cursor:pointer;">
        Don Smaily Chickles
      </div>
      <div onclick="selectProfile('persona1')" style="padding:16px; border:1px solid #ddd; border-radius:12px; margin:8px 0; cursor:pointer;">
        Itxel
      </div>
      <div onclick="selectProfile('persona2')" style="padding:16px; border:1px solid #ddd; border-radius:12px; margin:8px 0; cursor:pointer;">
        Alguien mas
      </div>
      
      <button onclick="closeProfileModal()" style="margin-top:20px; width:100%; padding:12px;">Cerrar</button>
    </div>
  </div>
  
  <script>
  	 function showProfileSwitcher() {
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profileModal').style.display = 'none';
    }

    function selectProfile(type) {
      currentProfile = profiles[type];
      closeProfileModal();
      alert(`Ahora estás publicando como: ${currentProfile.name}`);
    }


    // === Perfiles disponibles ===
    const profiles = {
      owner: {
        name: "Don Smaily Chickles",
        avatar: "https://i.postimg.cc/5tjZDbFG/8d7265278f12c0dac6bdacbc0ab2ea19.webp"
      },
      persona1: {
        name: "Itxel",
        avatar: "https://i.postimg.cc/mZVHmxyz/20260725-040054.jpg"
      },
      persona2: {
        name: "Alguien mas",
        avatar: "https://i.postimg.cc/wvZMh3Fd/1784940144053.jpg"
      }
    };

  </script>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://gthrsowfjdvrqxtqnuwp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0aHJzb3dmamR2cnF4dHFudXdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjM2NzIsImV4cCI6MjEwMDczOTY3Mn0.YoDY2hYgRZ8bBEdhBPK9wu3PnuJMcES8xp286fnDaUE';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentProfile = {
      name: "Don Smaily Chickles",
      avatar: "https://i.postimg.cc/5tjZDbFG/8d7265278f12c0dac6bdacbc0ab2ea19.webp"
    };

    // === Pestañas ===
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Panel').classList.add('active');

        if (tab.dataset.tab === 'stories') loadStories();
        if (tab.dataset.tab === 'photos') loadGallery();
      });
    });

    // === Crear Publicación ===
    window.createPost = async function() {
      const content = document.getElementById('postContent').value.trim();
      const files = document.getElementById('mediaInput').files;

      if (!content && files.length === 0) {
        alert("Escribe algo o selecciona un archivo");
        return;
      }

      const { data: post, error } = await supabase.from('posts').insert({
        content: content,
        author_name: currentProfile.name,
        author_avatar: currentProfile.avatar
      }).select().single();

      if (error) {
        alert("Error al publicar");
        return;
      }

      // Subir archivos (si hay)
      for (let file of files) {
        const path = `${post.id}/${Date.now()}-${file.name}`;
        const { data: upload } = await supabase.storage.from('profile-media').upload(path, file);
        const { data: urlData } = supabase.storage.from('profile-media').getPublicUrl(path);

        await supabase.from('media').insert({
          post_id: post.id,
          url: urlData.publicUrl,
          type: file.type.startsWith('video') ? 'video' : 'image'
        });
      }

      document.getElementById('postContent').value = '';
      document.getElementById('mediaInput').value = '';
      loadPosts();
    }

    // === Cargar Publicaciones ===
    async function loadPosts() {
      const { data } = await supabase
        .from('posts')
        .select(`*, media(*), comments(*)`)
        .order('created_at', { ascending: false });

      const container = document.getElementById('postsList');
      container.innerHTML = '';

      data.forEach(post => {
        const div = document.createElement('div');
        div.className = 'post';
        div.innerHTML = `
          <div class="post-header">
            <img src="${post.author_avatar}" class="post-avatar">
            <div>
              <strong>${post.author_name}</strong><br>
              <small style="color:#64748b">${new Date(post.created_at).toLocaleString()}</small>
            </div>
          </div>
          <p>${post.content || ''}</p>
          <div style="margin-top:12px; display:flex; gap:8px;">
            <button onclick="addComment('${post.id}')">Comentar</button>
            <button onclick="likePost('${post.id}')">Me gusta</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // === Stories (24 horas) ===
    window.createStory = async function() {
      const fileInput = document.getElementById('storyInput');
      if (!fileInput.files.length) return alert("Selecciona una imagen o video");

      const file = fileInput.files[0];
      const path = `stories/${Date.now()}-${file.name}`;
      
      const { data: upload } = await supabase.storage.from('profile-media').upload(path, file);
      const { data: urlData } = supabase.storage.from('profile-media').getPublicUrl(path);

      const expiresAt = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();

      await supabase.from('stories').insert({
        author_name: currentProfile.name,
        author_avatar: currentProfile.avatar,
        media_url: urlData.publicUrl,
        media_type: file.type.startsWith('video') ? 'video' : 'image',
        expires_at: expiresAt
      });

      fileInput.value = '';
      loadStories();
    }

    async function loadStories() {
      const { data } = await supabase
        .from('stories')
        .select('*')
        .gt('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false });

      const container = document.getElementById('storiesList');
      container.innerHTML = '';

      data.forEach(story => {
        const div = document.createElement('div');
        div.className = 'story-item';
        div.innerHTML = `
          <img src="${story.media_url}" style="width:100%; height:100%; object-fit:cover;">
          <div class="story-author">${story.author_name}</div>
        `;
        container.appendChild(div);
      });
    }

    async function loadGallery() {
      const { data } = await supabase.from('media').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('gallery');
      container.innerHTML = '';
      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        div.innerHTML = `<img src="${item.url}">`;
        container.appendChild(div);
      });
    }

    // Funciones básicas
    window.addComment = async function(postId) {
      const text = prompt("Escribe tu comentario:");
      if (!text) return;

      await supabase.from('comments').insert({
        post_id: postId,
        author: currentProfile.name,
        body: text
      });
      loadPosts();
    }

    window.likePost = async function(postId) {
      await supabase.from('likes').insert({ post_id: postId, client_id: crypto.randomUUID() });
      alert("¡Gracias por tu like!");
    }

    // Carga inicial
    function init() {
      loadPosts();
      // Cargar stories y galería cuando se cambie de pestaña
    }

    init();
  </script>
</body>
</html>
